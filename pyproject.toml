[project]
name = "graphrag-lab"
version = "0.1.0"
description = "可评测、可消融的 GraphRAG 参考实现（喜羊羊与灰太狼 × 铁甲小宝 角色关系语料）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
retrieval = ["numpy>=1.26", "sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
mcp = ["mcp>=2.2"]
all = ["numpy>=1.26", "sentence-transformers>=3.0", "anthropic>=0.40",
       "fastapi>=0.115", "uvicorn[standard]>=0.32", "mcp>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
