[project]
name = "graphrag-lab"
version = "0.1.0"
description = "可评测、可消融的 GraphRAG 参考实现（合成金融关系语料）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
retrieval = ["numpy>=1.26", "sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
all = ["numpy>=1.26", "sentence-transformers>=3.0", "anthropic>=0.40",
       "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
